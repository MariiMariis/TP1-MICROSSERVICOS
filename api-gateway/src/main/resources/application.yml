server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:api-gateway}
  cloud:
    gateway:
      server:
        webflux:
          # CORS liberado para o front-end React (Vite) chamar o gateway direto do navegador.
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              "[/**]":
                allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: "*"
                max-age: 3600
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true
          routes:
            - id: patient-service
              uri: lb://${PATIENT_SERVICE_ID:patient-service}
              predicates:
                - Path=${PATIENT_ROUTE:/api/patients/**}

            - id: appointment-service
              uri: lb://${APPOINTMENT_SERVICE_ID:appointment-service}
              predicates:
                - Path=${APPOINTMENT_ROUTE:/api/appointments/**}

            - id: medical-record-service
              uri: lb://${MEDICAL_RECORD_SERVICE_ID:medical-record-service}
              predicates:
                - Path=${MEDICAL_RECORD_ROUTE:/api/medical-records/**}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: ${EUREKA_FETCH_INTERVAL:5}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      access: unrestricted

info:
  app:
    name: api-gateway
    responsibility: Ponto unico de entrada e roteamento das requisicoes externas

logging:
  level:
    org.springframework.cloud.gateway: INFO
